# Builds the MiniStack image from a branch and pushes it to GHCR.
# Manual dispatch only. Only the repository owner can run it.
#
# Each run pushes one multi-arch image (amd64 and arm64) with two tags:
#   ghcr.io/<owner>/ministack:latest        (replaced by each run)
#   ghcr.io/<owner>/ministack:<commit-sha>  (kept, one for each build)
name: Build custom image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main-patched

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Stops a run (or a re-run) that another user starts.
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set image name and tag
        id: image
        run: |
          # GHCR names must be lowercase.
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ministack" >> "$GITHUB_OUTPUT"
          # github.sha is the default branch commit, so read the SHA of the built branch.
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=custom
          cache-to: type=gha,mode=max,scope=custom
